name: morpha-dev
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.11
  - numpy>=1.24
  - pip
  - black                    # code formatting
  - pylint                   # code linting
  - pyright                  # static type analysis
  - myst-parser              # Markdown support for Sphinx
  - pip:
    - typer>=0.9.0
    - rich>=13.0.0
    - pyyaml>=6.0
    - h5py>=3.8.0
    - pytest>=7.0
    - pytest-cov>=4.0
    - mypy>=1.0
