# ==================================================================================================
# Pyproject Configuration for the Morpha Package
# ==================================================================================================

# --- Build System Requirements --------------------------------------------------------------------

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"


# --- Package Metadata -----------------------------------------------------------------------------

[project]
name = "morpha"
version = "0.0.0"
authors = [{name = "Esther Poniatowski", email = "esther.poniatowski@ens.psl.eu"}]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
readme = {file = "README.md", content-type = "text/markdown"}
description = "Domain-agnostic data representation patterns for scientific computing"
keywords = ["data-structures", "numpy", "metadata", "dimensions", "scientific-computing", "creational-patterns"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha"
]
urls = {homepage = "https://github.com/esther-poniatowski/morpha"}


# --- Dependencies ---------------------------------------------------------------------------------

requires-python = ">=3.12"

dependencies = [
    "numpy>=1.26",           # Array manipulation with type stubs
    "typer",                 # CLI interface
    "rich",                  # Improved CLI output formatting
    "pyyaml>=6.0",            # YAML support for loaders/savers
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "mypy",

    "types-PyYAML",           # Type stubs for pyyaml
]
hdf5 = [
    "h5py>=3.0",             # HDF5 file support
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
]


# --- Package Source Code --------------------------------------------------------------------------

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# --- CLI Entry Points -----------------------------------------------------------------------------

[project.scripts]
morpha = "morpha.cli:app"


# --- Tool Configurations --------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = ["integration: marks integration tests"]
